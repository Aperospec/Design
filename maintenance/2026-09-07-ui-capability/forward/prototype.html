gn-items:center;justify-content:center;border:1px solid #bac7bd;background:white;border-radius:9px;padding:10px 4px;font-size:13px;min-height:49px;cursor:pointer;line-height:1.4;position:relative}.slot input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}.slot:has(input:checked){background:var(--soft);border:2px solid var(--brand);padding:9px 3px;color:var(--brand);font-weight:700}.slot:has(input:checked)::before{content:"✓";font-size:12px}.slot:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:3px}.slot:has(input:disabled){color:#748078;background:#f3f4f1;border-style:dashed;cursor:default}.slot small{font-size:11px}.primary,.secondary,.text-button{border-radius:9px;padding:10px 17px;min-height:46px;font-weight:650;font-size:14px}.primary{background:var(--brand);color:white;border:1px solid var(--brand)}.primary:hover:not(:disabled){background:var(--brand-dark)}.secondary{background:white;border:1px solid #aabbad;color:var(--brand)}.secondary:hover{background:var(--soft)}.text-button{padding:10px 9px;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:4px}.submit{width:100%;margin-top:2px}.submit-note{font-size:12px;text-align:center;color:var(--muted);margin-top:10px}.notice{border:1px solid #aecab8;background:var(--soft);border-radius:10px;padding:14px 16px;font-size:14px;margin-bottom:22px;overflow-wrap:anywhere}.notice strong{display:block;margin-bottom:2px}.notice.failure{border-color:#e3b4a8;background:var(--error-bg);color:var(--error);margin-bottom:14px}.notice.waiting{border-color:var(--line);background:var(--paper);display:flex;gap:10px;align-items:flex-start}.spinner{width:16px;height:16px;flex:none;border:2px solid #afc2b4;border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin-top:3px}@keyframes spin{to{transform:rotate(360deg)}}.no-results,.empty-bookings{border:1px dashed #b9c6bb;border-radius:var(--radius);background:#fff;text-align:center;padd ashed #a9ada6;border-radius:12px;background:#eff0ec;padding:0 18px;font-size:13px}.demo summary{padding:14px 0;cursor:pointer;font-weight:650}.demo summary span{font-weight:400;color:var(--muted);margin-left:10px}.demo-content{padding:0 0 18px}.demo-controls{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:14px}.demo-controls label{font-size:12px;display:grid;gap:5px}.demo-controls select{background:white;border:1px solid #bac3b8;border-radius:7px;padding:7px 10px;font-size:13px}.demo-controls .secondary{font-size:12px}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;clip:rect(0,0,0,0);overflow:hidden;white-space:nowrap;padding:0;border:0}

@media(max-width:360px){.wrap{padding:0 14px}.equipment{grid-template-columns:45px minmax(0,1fr);gap:12px;padding:15px}.equipment.selected{padding:14px}.equipment-art{height:45px}.equipment-art svg{width:36px;height:36px}.form-panel{padding:18px}.slot-grid{grid-template-columns:1fr}.member{max-width:72px;text-align:right}}

<body>
<a class="skip" href="#main">跳到主要内容</a>
<header class="masthead"><div class="wrap"><div class="identity"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>共享工作室</div><span class="member">成员工具 · 器材室</span></div></header>
<main class="wrap" id="main">
<div class="page-intro"><div><p class="eyebrow">一起创作，好好共用</p><h1>设备预约</h1><p class="lead">选择设备和时间，填写用途，安排下一次创作。</p></div><p class="today" id="today-label"></p></div>
<nav class="navigation" aria-label="设备预约导航"><button class="nav-button" id="nav-equipment" aria-current="page">预约设备</button><button class="nav-button" id="nav-bookings">我的预约 <span class="count" id="booking-count">0</span></button></nav>
<div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<section id="equipment-view" aria-label="预约设备"><div class="booking-layout">
<section aria-labelledby="equipment-heading"><div class="section-label"><span class="step" aria-hidden="true">1</span><h2 id="equipment-heading">选择设备</h2></div><label class="search-label" for="search">搜索设备</label><div class="search-wrap"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="输入设备名称或型号" autocomplete="off"></div><p class="result-count" id="result-count" role="status"></p><div class="equipment-list" id="equipment-list"></div></section>
<section class="form-panel" id="form-panel" aria-labelledby="form-heading"><div class="section-label"><span class="step" aria-hidden="true">2</span><h2 id="form-heading" tabindex="-1">填写预约</h2></div><div id="form-content"></div></section>
</div></section>
<section id="bookings-view" aria-labelledby="bookings-heading" hidden><div class="bookings-heading"><div><h2 id="bookings-heading" tabindex="-1">我的预约</h2><p class="small" id="bookings-summary"></p></div><button class="secondary" id="add-booking">＋ 预约设备</button></div><div id="success-banner"></div><div id="bookings-list"></div></section>
<footer class="page-footer"><span>一次预约一台设备 · 请按预约时间领取与归还</span><span>共享资源，留给每一次创作。</span></footer>
<details class="demo"><summary>原型演示 <span>检查专用，以下控件不属于成员界面</span></summary><div class="demo-content"><p>全部设备与预约均为虚构。本页不会提交真实预约；刷新页面即可重置。展开此区域可模拟失败与等待。</p><div class="demo-controls"><label for="demo-result">下一次提交结果<select id="demo-result"><option value="success">提交成功</option><option value="fail">失败一次，再试成功</option></select></label><label for="demo-delay">提交等待时间<select id="demo-delay"><option value="1600">1.6 秒</option><option value="5000">5 秒（观察等待状态）</option></select></label><button class="secondary" id="reset-demo">重置为空白初始状态</button></div><p class="hint">初始“我的预约”为空；在搜索框输入“咖啡机”可查看搜索无结果。取消预约可查看限时撤销。</p></div></details>
</main>
<script>
'use strict';
const equipment=[
{id:'camera',name:'Studio Camera A7 IV',category:'相机',description:'机身、标准镜头与备用电池',icon:'camera'},
{id:'recorder',name:'便携录音机 Zoom H6',category:'录音设备',description:'录音机、收纳包与监听耳机',icon:'recorder'},
{id:'light',name:'可折叠摄影灯',category:'灯光设备',description:'柔光灯、折叠灯架与电源线',icon:'light'},
{id:'kit',name:'移动影像创作套装 Sony FX30 Cinema Line — 含 18–105mm 镜头、双通道无线麦克风与肩托支架',category:'拍摄套装',description:'适合需要同时拍摄影像和收录声音的创作',icon:'kit'}];
const slots=['09:00–11:00','11:00–13:00','14:00–16:00','16:00–18:00'];
const state={tab:'equipment',selected:null,date:localToday(),slot:'',purpose:'',query:'',bookings:[],pending:false,errors:{},failure:false,successId:null,nextId:1};
const $=id=>document.getElementById(id);
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateLabel(value){return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(value+'T12:00:00'));}
function tell(message){$('announcement').textContent='';setTimeout(()=>{$('announcement').textContent=message;},20);}
function icon(kind){const paths={camera:'<path d="M9 18h9l4-5h15l4 5h7v26H9z"/><circle cx="29" cy="31" r="9"/><circle cx="29" cy="31" r="5"/><path d="M13 23h7M41 23h3"/>',recorder:'<rect x="19" y="17" width="22" height="35" rx="4"/><path d="m21 17-5-8m23 8 5-8M17 7l-4 3m32-3 4 3"/><rect x="24" y="24" width="12" height="9" rx="1"/><circle cx="30" cy="41" r="4"/>',light:'<path d="m14 9 25-3 8 20-25 4zM30 30v16m0-5-13 12m13-12 13 12M30 45v9"/><path d="m22 13 13-2m-10 6 13-2m-10 6 13-2"/>',kit:'<path d="M8 20h38v26H8zM20 20v-6h14v6m12 6 8-4v20l-8-4M8 46h42M16 50h27"/><circle cx="28" cy="33" r="8"/><path d="M12 24h6"/>'};return `<svg viewBox="0 0 60 60" aria-hidden="true">${paths[kind]}</svg>`;}
function isTaken(equipmentId,date,slot){return state.bookings.some(b=>b.status==='confirmed'&&b.equipmentId===equipmentId&&b.date===date&&b.slot===slot);}
function renderEquipment(){const q=state.query.trim().toLocaleLowerCase();const matches=equipment.filter(e=>(e.name+' '+e.category).toLocaleLowerCase().includes(q));$('result-count').textContent=q?`找到 ${matches.length} 台设备`:`共 ${equipment.length} 台设备 · 选择后查看可用时段`;$('equipment-list').innerHTML=matches.length?matches.map(e=>`<article class="equipment ${state.selected===e.id?'selected':''}"><div class="equipment-art">${icon(e.icon)}</div><div class="equipment-copy"><p class="category">${e.category}</p><h3>${escapeHTML(e.name)}</h3><p class="description">${e.description}</p><div class="equipment-bottom"><span class="availability">可查看预约时段</span><button class="choose" data-equipment="${e.id}" aria-pressed="${state.selected===e.id}" aria-label="${state.selected===e.id?'已选择':'选择设备'}：${escapeHTML(e.name)}" ${state.pending?'disabled':''}>${state.selected===e.id?'✓ 已选择':'选择设备'}</button></div></div></article>`).join(''):`<div class="no-results"><h3>没有找到相关设备</h3><p class="small">试试设备名称或型号，也可以查看全部设备。</p><button class="secondary" id="clear-search">清除搜索</button></div>`;$('equipment-list').querySelectorAll('[data-equipment]').forEach(b=>b.addEventListener('click',()=>chooseEquipment(b.dataset.equipment)));const clear=$('clear-search');if(clear)clear.onclick=()=>{state.query='';$('search').value='';renderEquipment();$('search').focus();};}
function chooseEquipment(id){if(state.pending)return;if(state.selected!==id){state.selected=id;state.slot='';state.errors={};state.failure=false;}renderEquipment();renderForm();$('form-heading').focus({preventScroll:true});$('form-panel').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
function fieldError(key){return state.errors[key]?`<p class="error" id="${key}-error">${state.errors[key]}</p>`:'';}
function renderForm(){const e=equipment.find(e=>e.id===state.selected);if(!e){$('form-content').innerHTML='<div class="form-empty"><div class="outline-icon" aria-hidden="true">↖</div><h3>先选一台设备</h3><p class="small">选好后，在这里安排使用时间。</p><ol><li><span>01</span>找到需要的设备</li><li><span>02</span>选择日期和一个时段，填写用途</li><li><span>03</span>提交后，在“我的预约”中查看</li></ol></div>';return;}
const busy=state.pending?'disabled':'';
$('form-content').innerHTML=`<div class="chosen-summary"><p class="small">已选设备 · 每次预约一台</p><strong>${escapeHTML(e.name)}</strong></div><form id="reservation-form" novalidate aria-busy="${state.pending}"><fieldset ${busy}><legend class="sr-only">预约日期、时段与用途</legend><div class="field"><label class="field-label" for="booking-date">预约日期<span class="required-note">必填</span></label><input id="booking-date" name="date" type="date" min="${localToday()}" value="${escapeHTML(state.date)}" required aria-describedby="date-hint${state.errors.date?' date-error':''}" aria-invalid="${Boolean(state.errors.date)}"><p class="hint" id="date-hint">${state.date===localToday()?'已默认选择今天；也可以选择之后的日期。':'请选择今天或之后的日期。'}</p>${fieldError('date')}</div><fieldset class="field"><legend>使用时段<span class="required-note">必选一项</span></legend><div class="slot-grid">${slots.map(s=>{const taken=isTaken(e.id,state.date,s);return `<label class="slot"><input type="radio" name="slot" value="${s}" ${state.slot===s?'checked':''} ${taken?'disabled':''} required aria-describedby="slot-hint${state.errors.slot?' slot-error':''}" aria-invalid="${Boolean(state.errors.slot)}"><span>${s}</span>${taken?'<small>已预约</small>':''}</label>`;}).join('')}</div><p class="hint" id="slot-hint">每段 2 小时；已预约的时段不可选择。</p>${fieldError('slot')}</fieldset><div class="field"><label class="field-label" for="purpose">预约用途<span class="required-note">必填</span></label><textarea id="purpose" name="purpose" placeholder="例如：拍摄作品集中的陶瓷作品" required aria-describedby="purpose-hint${state.errors.purpose?' purpose-error':''}" aria-invalid="${Boolean(state.errors.purpose)}">${escapeHTML(state.purpose)}</textarea><p class="hint" id="purpose-hint">简单说明这次要做什么，方便工作室安排设备。</p>${fieldError('purpose')}</div></fieldset>${state.failure?'<div class="notice failure" role="alert"><strong>暂时没能提交预约</strong>填写内容已保留，请再试一次。</div>':''}${state.pending?'<div class="notice waiting" role="status"><span class="spinner" aria-hidden="true"></span><span>正在提交预约，请稍候。<br><span class="small">完成前请留在本页。</span></span></div>':''}<button class="primary submit" type="submit" ${busy}>${state.pending?'正在提交…':state.failure?'再次提交预约':'确认预约'}</button><p class="submit-note">提交成功后，可在“我的预约”中查看或取消。</p></form>`;
$('booking-date').onchange=e=>{state.date=e.target.value;state.slot='';delete state.errors.date;delete state.errors.slot;renderForm();$('booking-date').focus();};$('purpose').oninput=e=>{state.purpose=e.target.value;};$('reservation-form').querySelectorAll('input[name=slot]').forEach(input=>input.onchange=e=>{state.slot=e.target.value;});$('reservation-form').onsubmit=submitBooking;}
function setBusy(busy){state.pending=busy;['nav-equipment','nav-bookings','search','demo-result','demo-delay','reset-demo'].forEach(id=>$(id).disabled=busy);renderEquipment();renderForm();}
function submitBooking(event){event.preventDefault();if(state.pending)return;state.errors={};const input=$('booking-date');state.date=input.value;state.purpose=$('purpose').value;state.slot=$('reservation-form').querySelector('input[name=slot]:checked')?.value||'';if(!state.date)state.errors.date='请选择预约日期。';else if(state.date<localToday()||!input.validity.valid)state.errors.date='请选择今天或之后的有效日期。';if(!state.slot)state.errors.slot='请选择一个使用时段。';else if(isTaken(state.selected,state.date,state.slot))state.errors.slot='这个时段已被预约，请选择其他时段。';if(!state.purpose.trim())state.errors.purpose='请填写这次预约的用途。';if(Object.keys(state.errors).length){state.failure=false;renderForm();const first=state.errors.date?$('booking-date'):state.errors.slot?$('reservation-form').querySelector('input[name=slot]:not(:disabled)'):$('purpose');first?.focus();tell('预约尚未提交，请检查标出的内容。');return;}
state.failure=false;const shouldFail=$('demo-result').value==='fail';const delay=Number($('demo-delay').value);$('demo-result').value='success';setBusy(true);setTimeout(()=>{if(shouldFail){state.failure=true;setBusy(false);$('reservation-form').querySelector('button[type=submit]').focus();return;}const booking={id:state.nextId++,equipmentId:state.selected,date:state.date,slot:state.slot,purpose:state.purpose.trim(),status:'confirmed',remaining:0,hover:false,focused:false};state.bookings.unshift(booking);state.successId=booking.id;state.selected=null;state.date=localToday();state.slot='';state.purpose='';state.errors={};setBusy(false);switchView('bookings');tell('预约成功，已保存到我的预约。');},delay);}
function switchView(tab){if(state.pending)return;state.tab=tab;$('equipment-view').hidden=tab!=='equipment';$('bookings-view').hidden=tab!=='bookings';['equipment','bookings'].forEach(name=>{if(tab===name)$('nav-'+name).setAttribute('aria-current','page');else $('nav-'+name).removeAttribute('aria-current');});if(tab==='bookings'){renderBookings();$('bookings-heading').focus({preventScroll:true});$('bookings-view').scrollIntoView({block:'start'});}else{$('equipment-heading').setAttribute('tabindex','-1');$('equipment-heading').focus({preventScroll:true});$('equipment-view').scrollIntoView({block:'start'});}}
function renderCount(){$('booking-count').textContent=state.bookings.filter(b=>b.status==='confirmed').length;}
function renderBookings(){renderCount();const count=state.bookings.filter(b=>b.status==='confirmed').length;$('bookings-summary').textContent=state.bookings.length?`${count} 条已确认预约`:'预约成功后，会出现在这里。';$('success-banner').innerHTML=state.successId?'<div class="notice" role="status"><strong>✓ 预约成功</strong>设备与时间已确认，预约详情在下方。</div>':'';if(!state.bookings.length){$('bookings-list').innerHTML='<div class="empty-bookings"><div class="empty-glyph" aria-hidden="true">▤</div><h2>还没有预约</h2><p class="small">需要相机、录音机或灯光？<br>从选择一台设备开始。</p><button class="primary" id="empty-start">去预约设备</button></div>';$('empty-start').onclick=()=>switchView('equipment');return;}
$('bookings-list').innerHTML=`<div class="reservations">${state.bookings.map(b=>{const e=equipment.find(e=>e.id===b.equipmentId);return `<article class="reservation" id="reservation-${b.id}"><div class="reservation-top"><h3>${escapeHTML(e.name)}</h3><span class="status-badge ${b.status==='cancelled'?'cancelled':''}">${b.status==='confirmed'?'已确认':'已取消'}</span></div><dl><dt>使用时间</dt><dd>${dateLabel(b.date)}　${b.slot}</dd><dt>预约用途</dt><dd>${escapeHTML(b.purpose)}</dd></dl><div class="reservation-footer"><span class="reference">预约编号 WS-${String(b.id).padStart(3,'0')}</span>${b.status==='confirmed'?`<button class="text-button" data-cancel="${b.id}" aria-label="取消预约：${escapeHTML(e.name)}，${dateLabel(b.date)} ${b.slot}">取消预约</button>`:`<button class="secondary" data-rebook="${b.id}">重新预约</button>`}</div>${b.status==='cancelled'?`<div class="undo-region" id="undo-region-${b.id}" data-undo-region="${b.id}">${undoContent(b)}</div>`:''}</article>`;}).join('')}</div>`;
$('bookings-list').querySelectorAll('[data-cancel]').forEach(btn=>btn.onclick=()=>cancelBooking(Number(btn.dataset.cancel)));$('bookings-list').querySelectorAll('[data-rebook]').forEach(btn=>btn.onclick=()=>rebook(Number(btn.dataset.rebook)));$('bookings-list').querySelectorAll('[data-undo-region]').forEach(region=>{const b=state.bookings.find(b=>b.id===Number(region.dataset.undoRegion));b.hover=false;b.focused=false;region.onpointerenter=()=>b.hover=true;region.onpointerleave=()=>b.hover=false;region.onfocusin=()=>b.focused=true;region.onfocusout=e=>{if(!region.contains(e.relatedTarget))b.focused=false;};});bindUndoButtons();}
function undoContent(b){return b.remaining>0?`<p><strong>预约已取消。</strong><br><span class="remaining" id="remaining-${b.id}">${Math.ceil(b.remaining/1000)}</span> 秒内可撤销；操作时暂停计时。</p><div class="undo-actions"><button class="secondary" data-undo="${b.id}">撤销取消</button><button class="text-button" data-extend="${b.id}">延长 20 秒</button></div>`:'<p>预约已取消，撤销时间已结束。如有需要，可以重新预约。</p>';}
function bindUndoButtons(){$('bookings-list').querySelectorAll('[data-undo]').forEach(btn=>btn.onclick=()=>undoCancel(Number(btn.dataset.undo)));$('bookings-list').querySelectorAll('[data-extend]').forEach(btn=>btn.onclick=()=>{const b=state.bookings.find(b=>b.id===Number(btn.dataset.extend));b.remaining+=20000;$('remaining-'+b.id).textContent=Math.ceil(b.remaining/1000);tell('已延长 20 秒撤销时间。');});}
function cancelBooking(id){const b=state.bookings.find(b=>b.id===id);b.status='cancelled';b.remaining=20000;state.successId=null;renderBookings();renderEquipment();renderForm();const heading=$('reservation-'+id).querySelector('h3');heading.tabIndex=-1;heading.focus({preventScroll:true});tell('预约已取消，20 秒内可以撤销。操作区域获得焦点时会暂停计时。');}
function undoCancel(id){const b=state.bookings.find(b=>b.id===id);if(b.remaining<=0)return;if(isTaken(b.equipmentId,b.date,b.slot)){b.remaining=0;$('undo-region-'+id).innerHTML='<p role="alert">这个时段已有新预约，无法恢复。请选择其他时段重新预约。</p>';return;}b.status='confirmed';b.remaining=0;renderBookings();renderEquipment();renderForm();$('bookings-list').querySelector(`[data-cancel="${id}"]`).focus({preventScroll:true});tell('已撤销取消，预约恢复为已确认。');}
function rebook(id){const b=state.bookings.find(b=>b.id===id);state.selected=b.equipmentId;state.date=b.date>=localToday()?b.date:localToday();state.slot=isTaken(b.equipmentId,state.date,b.slot)?'':b.slot;state.purpose=b.purpose;state.failure=false;state.errors={};state.successId=null;renderEquipment();renderForm();switchView('equipment');$('form-heading').focus({preventScroll:true});$('form-panel').scrollIntoView({block:'start'});}
let lastTick=Date.now();setInterval(()=>{const now=Date.now();const elapsed=now-lastTick;lastTick=now;state.bookings.forEach(b=>{if(b.status!=='cancelled'||b.remaining<=0||b.hover||b.focused||document.hidden)return;b.remaining=Math.max(0,b.remaining-elapsed);const timer=$('remaining-'+b.id);if(timer)timer.textContent=Math.ceil(b.remaining/1000);if(b.remaining===0){const region=$('undo-region-'+b.id);if(region)region.innerHTML=undoContent(b);}});},250);
$('search').oninput=e=>{state.query=e.target.value;renderEquipment();};$('nav-equipment').onclick=()=>switchView('equipment');$('nav-bookings').onclick=()=>{state.successId=null;switchView('bookings');};$('add-booking').onclick=()=>{state.successId=null;switchView('equipment');};$('reset-demo').onclick=()=>{if(!state.pending)location.reload();};$('today-label').textContent='今天 · '+dateLabel(localToday());renderEquipment();renderForm();renderCount();
</script>
</body>
</html>
